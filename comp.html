<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Compare the old and new renderers side by side."
    />
    <title>Renderer comparison | Pokejourney</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        max-width: 1100px;
      }

      .page {
        padding-top: 1rem;
      }

      .comparison-section {
        margin-top: 2rem;
      }

      .img-comp-container {
        position: relative;
        width: 100%;
        max-width: 960px;
        margin: 1.5rem auto;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        touch-action: pan-y;
      }

      .img-comp-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .img-comp-img img {
        position: absolute;
        inset: 0 auto auto 0;
        display: block;
        width: 100%;
        max-width: none;
        height: 100%;
        margin: 0;
        border: 0;
        border-radius: 0;
        object-fit: cover;
      }

      .img-comp-overlay {
        width: 50%;
      }

      .img-comp-slider {
        position: absolute;
        z-index: 3;
        top: 50%;
        left: 50%;
        width: 42px;
        height: 42px;
        transform: translate(-50%, -50%);
        border: 2px solid #fff;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
        cursor: ew-resize;
        touch-action: none;
      }

      .img-comp-slider:focus-visible {
        outline: 3px solid var(--text);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <h1>Compare Two Images</h1>
      </div>
    </header>

    <main class="page container">
      <article>
        <section class="chapter-section comparison-section" aria-labelledby="comparison-title">
          <h2 id="comparison-title">Renderer comparison</h2>
          <p>Drag the slider to compare the old renderer on the left with the new renderer on the right.</p>

          <div class="img-comp-container" aria-label="Interactive image comparison">
            <div class="img-comp-img">
              <img src="images/dq4b.png" alt="Old renderer" />
            </div>
            <div class="img-comp-img img-comp-overlay">
              <img src="images/dq4a.png" alt="New renderer" />
            </div>
            <button
              class="img-comp-slider"
              type="button"
              aria-label="Drag to compare images"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="50"
            ></button>
          </div>
        </section>
      </article>
    </main>

    <script>
      (() => {
        const container = document.querySelector(".img-comp-container");
        const overlay = container.querySelector(".img-comp-overlay");
        const slider = container.querySelector(".img-comp-slider");
        const images = container.querySelectorAll("img");
        let dragging = false;

        function updateAspectRatio() {
          const reference = images[0];
          if (!reference || !reference.naturalWidth || !reference.naturalHeight) return;

          container.style.aspectRatio = `${reference.naturalWidth} / ${reference.naturalHeight}`;
        }

        function setSliderPosition(clientX) {
          const rect = container.getBoundingClientRect();
          const percentage = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));

          overlay.style.width = `${percentage}%`;
          slider.style.left = `${percentage}%`;
          slider.setAttribute("aria-valuenow", String(Math.round(percentage)));
        }

        function onPointerMove(event) {
          if (!dragging) return;
          setSliderPosition(event.clientX);
        }

        slider.addEventListener("pointerdown", (event) => {
          dragging = true;
          slider.setPointerCapture(event.pointerId);
          setSliderPosition(event.clientX);
        });

        slider.addEventListener("pointermove", onPointerMove);
        slider.addEventListener("pointerup", () => {
          dragging = false;
        });
        slider.addEventListener("pointercancel", () => {
          dragging = false;
        });

        slider.addEventListener("keydown", (event) => {
          const rect = container.getBoundingClientRect();
          const currentValue = Number(slider.getAttribute("aria-valuenow")) || 50;

          if (event.key === "ArrowLeft") {
            event.preventDefault();
            setSliderPosition(rect.left + ((currentValue - 5) / 100) * rect.width);
          } else if (event.key === "ArrowRight") {
            event.preventDefault();
            setSliderPosition(rect.left + ((currentValue + 5) / 100) * rect.width);
          }
        });

        window.addEventListener("resize", updateAspectRatio);
        images.forEach((img) => img.addEventListener("load", updateAspectRatio));

        updateAspectRatio();
        setSliderPosition(container.getBoundingClientRect().left + container.getBoundingClientRect().width * 0.5);
      })();
    </script>
  </body>
</html>
